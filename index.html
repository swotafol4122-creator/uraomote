/* ── 封を切る（なぞって破り、1枚ずつめくる） ── */
const PK={kind:null,cards:[],i:0,phase:'seal',refund:0,x0:0,y0:0,drag:0,dragging:false,flipped:false};
function openPack(kind){
  const P=PACKS[kind]||PACKS.fu;
  if(S.souls<P.cost) return toast('魂片が足りません');
  S.souls-=P.cost; S.opened++;
  const got=drawPack(kind); let refund=0;
  got.forEach(c=>{ if(ownedCount(c.id)>=copyCap(c)) refund+=RAR[c.rar].v; else addCard(c.id,1); });
  S.souls+=refund; save();
  PK.kind=kind; PK.cards=got; PK.i=0; PK.phase='seal'; PK.refund=refund;
  PK.drag=0; PK.dragging=false; PK.flipped=false; PK.busy=false;
  packRender();
}
function packDots(){
  return `<div class="packrow">`+PK.cards.map((c,i)=>{
    const done=i<PK.i;
    return `<div class="pdot ${done?'done':''}" style="color:${RAR[c.rar].c};${done?'background:'+RAR[c.rar].c+';border-color:'+RAR[c.rar].c:''}">${done?c.o.g:'？'}</div>`;
  }).join('')+`</div>`;
}
function packRender(){
  const P=PACKS[PK.kind]||PACKS.fu;
  if(PK.phase==='seal'){
    sheet(`<div class="packstage">
      <div class="packhead">${P.nm}　${P.n}枚</div>
      <div class="wrapper big" id="packwrap">
        <div class="seal">${P.nm[0]}</div>
        <div class="cutband">
          <div class="cutprog" id="cutprog"></div>
          <div class="lbl">切 取 線</div>
          <div class="cutdot" id="cutdot"></div>
          <div class="slit" id="packslit"></div>
        </div>
      </div>
      <div class="tearhint">この<b>切取線</b>を左右になぞる</div>
      <button class="btn sm ghost" onclick="packTear()">なぞらずに開ける</button>
    </div>`,true);
    const wr=$('packwrap');
    if(wr){
      wr.addEventListener('pointerdown',packDown);
      wr.addEventListener('pointermove',packMove);
      wr.addEventListener('pointerup',packUp);
      wr.addEventListener('pointercancel',packUp);
      wr.addEventListener('touchstart',packDown,{passive:false});
      wr.addEventListener('touchmove',packMove,{passive:false});
      wr.addEventListener('touchend',packUp);
    }
    return;
  }
  if(PK.phase==='cards'){
    const c=PK.cards[PK.i], o=c[PK.flipped?'u':'o'];
    const ura=c.u, kw=(ura.kw||[]).join('・');
    return sheetCards(c,ura,kw,P);
  }
  /* 開け終わり */
  const best=PK.cards.slice().sort((a,b)=>RAR[b.rar].v-RAR[a.rar].v)[0];
  const cards=PK.cards.map((c,i)=>`<div style="animation-delay:${i*.07}s">${cardHTML(c,'o',{attr:`onclick="cardDetail(BYID['${c.id}'])"`})}</div>`).join('');
  sheet(`<h3>${P.nm}を切った</h3><div class="crumb">最上位：<span style="color:${RAR[best.rar].c}">${best.rar}</span>「${esc(best.nm)}」</div>
    <div class="reveal" style="margin-top:14px">${cards}</div>
    ${PK.refund?`<p class="muted" style="text-align:center;margin-top:12px">上限ぶん ${PK.refund} 魂片が戻りました。</p>`:''}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sm" style="flex:1" ${S.souls<P.cost?'disabled':''} onclick="openPack('${PK.kind}')">もう一封（${P.cost}）</button>
      <button class="btn sm solid" style="flex:1" onclick="closeSheet();drawShop()">しまう</button>
    </div>`);
  drawShop();
}
function sheetCards(c,ura,kw,P){
  const rc=RAR[c.rar];
  sheet(`<div class="packstage">
    <div class="packhead">${PK.i+1} / ${PK.cards.length}　${PK.flipped?'<span style="color:'+rc.c+'">'+c.rar+'</span>':'封の中'}</div>
    <div class="pstage" id="pstage">
      <div class="burst" id="pburst" style="background:radial-gradient(circle,${rc.c}cc,transparent 68%)"></div>
      <div class="pflip ${PK.flipped?'on':''}" id="pflip">
        <div class="pf b">${backHTML().replace('class="card back"','class="card back" style="width:176px;height:258px"')}</div>
        <div class="pf f">${cardHTML(c,'o',{big:1})}</div>
      </div>
    </div>
    ${PK.flipped?`<div class="uraline">裏の顔　<b>${esc(ura.n)}</b>　${ura.c}気${ura.t==='u'?'　力'+ura.a+'／耐'+ura.h:'　術'}<br>
      ${kw?'<span style="color:var(--kin-dim)">'+kw+'</span>　':''}${esc(ura.tx||'')}</div>`:''}
    ${packDots()}
    <div class="tearhint">${PK.flipped?'ゆっくり読んでから<b>次の札へ</b>':'<b>札に触れて</b>めくる'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      ${PK.flipped?`<button class="btn sm" onclick="cardDetail(BYID['${c.id}'],'packRender()')">両面を大きく見る</button>
        <button class="btn sm solid" onclick="packNext()">次の札へ（${PK.i+1}/${PK.cards.length}）</button>`
        :`<button class="btn sm solid" onclick="packStep()">めくる</button>`}
      <button class="btn sm ghost" onclick="packAll()">全部めくる</button>
    </div>
  </div>`,true);
  const st=$('pstage');
  if(st){
    st.addEventListener('pointerup',packTapCard);
    st.addEventListener('touchend',e=>{e.preventDefault();packTapCard();},{passive:false});
  }
}
function packTapCard(){
  if(PK.phase!=='cards'||PK.busy) return;
  if(!PK.flipped) return packStep();
  cardDetail(PK.cards[PK.i],'packRender()');   /* めくった後は消えず、両面を読める */
}
function pxy(e){
  if(e.touches&&e.touches[0]) return [e.touches[0].clientX,e.touches[0].clientY];
  if(e.changedTouches&&e.changedTouches[0]) return [e.changedTouches[0].clientX,e.changedTouches[0].clientY];
  return [e.clientX||0,e.clientY||0];
}
function packDown(e){ const p=pxy(e); PK.x0=p[0]; PK.y0=p[1]; PK.drag=0; PK.dragging=true; }
function packMove(e){
  if(!PK.dragging||PK.phase!=='seal') return;
  if(e.cancelable) e.preventDefault();
  const p=pxy(e);
  PK.drag=Math.max(PK.drag,Math.abs(p[0]-PK.x0)+Math.abs(p[1]-PK.y0)*0.35);
  const wr=$('packwrap'); if(!wr) return;
  const w=wr.offsetWidth||196, r=Math.min(1,PK.drag/(w*0.62));
  const sl=$('packslit'); if(sl) sl.style.height=(r*13)+'px';
  const pg=$('cutprog'); if(pg) pg.style.width=(r*100)+'%';
  const dt=$('cutdot'); if(dt&&r>0.05) dt.style.display='none';
  if(r>=1){ PK.dragging=false; packTear(); }
}
function packUp(){
  if(PK.phase!=='seal') return;
  PK.dragging=false;
  const wr=$('packwrap'), sl=$('packslit'), pg=$('cutprog'), dt=$('cutdot');
  if(sl) sl.style.height='0px';
  if(pg) pg.style.width='0%';
  if(dt) dt.style.display='';
  if(wr&&PK.drag>4){ wr.classList.add('shake'); setTimeout(()=>wr&&wr.classList.remove('shake'),320); }
  PK.drag=0;
}
function packTear(){
  if(PK.phase!=='seal') return;
  PK.phase='cards'; PK.i=0; PK.flipped=false;
  const wr=$('packwrap');
  sfx('flip');
  if(wr){ wr.classList.add('torn'); setTimeout(packRender,430); }
  else packRender();
}
function packStep(){          /* めくるだけ。札はその場に留まる */
  if(PK.phase!=='cards'||PK.busy||PK.flipped) return;
  PK.flipped=true;
  const fl=$('pflip'); if(fl) fl.classList.add('on');
  const c=PK.cards[PK.i], hi=RAR[c.rar].v>=50;
  sfx(hi?'win':'card');
  if(hi){ const b=$('pburst'); if(b){ b.classList.add('on'); setTimeout(()=>b&&b.classList.remove('on'),950); } }
  setTimeout(()=>{ if(PK.phase==='cards'&&PK.flipped) packRender(); },560);
}
function packNext(){          /* 読み終えてから自分で進める */
  if(PK.phase!=='cards'||PK.busy||!PK.flipped) return;
  PK.busy=true;
  const st=$('pstage');
  const go=()=>{ PK.busy=false; PK.i++; PK.flipped=false;
    PK.phase = PK.i>=PK.cards.length ? 'done':'cards'; packRender(); };
  if(st){ st.classList.add('gone'); setTimeout(go,300); } else go();
}
function packAll(){ PK.busy=false; PK.i=PK.cards.length; PK.phase='done'; sfx('card'); packRender(); }
function grantRare(minRar){
  const ok=minRar==='極'?['極','神']:['秘','極','神'];
  let pool=CARDS.filter(c=>ok.indexOf(c.rar)>=0&&ownedCount(c.id)<copyCap(c));
  if(!pool.length) pool=CARDS.filter(c=>ownedCount(c.id)<copyCap(c));
  if(!pool.length) return null;
  const c=pick(pool); addCard(c.id,1); return c;
}

/* ============ 組札 ============ */
let DECKTAB='in', POOLA='all', POOLK='all', POOLKO=false;
const DECKSLOTS=6;
function drawDeck(){
  const d=ensureDeck(), n=deckCount(d);
  const curve=[0,0,0,0,0,0,0,0];
  for(const k in d.cards){ const c=Math.max(1,Math.min(8,minCost(BYID[k]))); curve[c-1]+=d.cards[k]; }
  const mx=Math.max(1,...curve);
  const slots=S.decks.map((x,i)=>`<button class="asel ${S.active===i?'on':''}" onclick="pickDeck(${i})">${i+1}. ${esc(x.nm)}<span style="opacity:.6"> ${deckCount(x)}</span></button>`).join('')
    + (S.decks.length<DECKSLOTS?`<button class="asel" onclick="newDeck()">＋</button>`:'')
    + (S.decks.length>1?`<button class="asel" onclick="delDeck()">消す</button>`:'');
  const aspBtns=ASPLIST.map(a=>`<button class="asel ${d.asp.indexOf(a)>=0?'on':''}" onclick="toggleAsp('${a}')">${ASP[a].n}</button>`).join('');
  const soBtns=d.asp.concat(['nu']).map(a=>`<button class="asel ${d.sorei===a?'on':''}" onclick="setSorei('${a}')">${SOREI[a].n}</button>`).join('');
  const row=(C,inDeck)=>{
    const used=d.cards[C.id]||0, cap=usable(C.id);
    return `<div class="dkline" style="${!inDeck&&used>=cap?'opacity:.42':''}">
      <div class="c">${minCost(C)}</div>
      <div class="n" onclick="cardDetail(BYID['${C.id}'])">${esc(C.nm)}<span style="color:var(--gray);font-size:11px"> ${ASP[C.asp].n}・<span style="color:${RAR[C.rar].c}">${C.rar}</span></span>${kwWhere(C,POOLK)}</div>
      <div class="q" ${inDeck?'':'style="color:var(--gray)"'}>${inDeck?'×'+used:used+'/'+cap}</div>
      ${inDeck?`<button class="btn sm ghost" onclick="deckAdj('${C.id}',-1)">－</button>`:''}
      <button class="btn sm" onclick="deckAdj('${C.id}',1)">＋</button></div>`;
  };
  const inKeys=Object.keys(d.cards).filter(k=>cardHas(BYID[k],POOLK))
    .sort((a,b)=>minCost(BYID[a])-minCost(BYID[b])||BYID[a].nm.localeCompare(BYID[b].nm));
  const inRows=inKeys.map(k=>row(BYID[k],true)).join('')
    || `<p class="muted">${POOLK==='all'?'まだ1枚も入っていません。':POOLK+'を持つ札は入っていません。'}</p>`;
  const pk=['all'].concat(d.asp,['nu']);
  const ptabs=pk.map(k=>`<button class="asel ${POOLA===k?'on':''}" onclick="POOLA='${k}';drawDeck()">${k==='all'?'全て':ASP[k].n}</button>`).join('');
  const poolCards=CARDS.filter(c=>ownedCount(c.id)>0&&legalIn(c,d.asp)&&(POOLA==='all'||c.asp===POOLA)&&cardHas(c,POOLK))
    .sort((a,b)=>minCost(a)-minCost(b)||a.nm.localeCompare(b.nm));
  const pool=poolCards.map(C=>row(C,false)).join('')
    || `<p class="muted">${POOLK}を持つ札は、この相の蔵にありません。</p>`;

  $('screen-deck').innerHTML=`
    <div class="topbar"><h2>組札</h2><div class="spacer"></div>
      <div class="coin" style="${n===DECKMAX?'':'color:#e8674f;border-color:#c4402f'}">${n}／${DECKMAX}</div></div>
    <div class="crumb" style="margin-bottom:6px">組札は${DECKSLOTS}つまで持てる（対人戦の相手用にも使う）</div>
    <div class="aspbar">${slots}</div>
    <div class="panel" style="margin-top:10px">
      <div class="crumb" style="margin-bottom:6px">相を二つ選ぶ（無はいつでも入る）</div>
      <div class="aspbar">${aspBtns}</div>
      <div class="crumb" style="margin:10px 0 6px">祖霊（毎ターン1回・2気）</div>
      <div class="aspbar">${soBtns}</div>
      <p class="muted" style="margin:6px 0 0">${SOREI[d.sorei].tx}</p>
      <div class="crumb" style="margin:12px 0 6px">気の曲線</div>
      <div class="curve">${curve.map((v,i)=>`<div style="height:${Math.round(v/mx*100)}%"><span>${i+1}</span></div>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:26px">
        <button class="btn sm" onclick="autoFill()">おまかせで30枚</button>
        <button class="btn sm ghost" onclick="clearDeck()">全部戻す</button>
      </div>
    </div>
    <div class="aspbar" style="margin-top:14px">
      <button class="asel ${DECKTAB==='in'?'on':''}" onclick="DECKTAB='in';drawDeck()">入っている札</button>
      <button class="asel ${DECKTAB==='pool'?'on':''}" onclick="DECKTAB='pool';drawDeck()">蔵から足す</button>
    </div>
    ${DECKTAB==='pool'?`<div class="raritybar">${ptabs}</div>`:''}
    ${kwBar(POOLK,'poolKw',POOLKO)}
    ${POOLK!=='all'?`<p class="muted" style="margin:6px 0 0"><b style="color:var(--kin-hi)">${POOLK}</b>：${KWTX[POOLK]||''}　該当${DECKTAB==='in'?inKeys.length:poolCards.length}種</p>`:''}
    <div style="margin-top:6px">${DECKTAB==='in'?inRows:pool}</div>`;
}
function poolKw(k){
  if(k==='open'){ POOLKO=true; } else if(k==='close'){ POOLKO=false; } else { POOLK=k; POOLKO=false; }
  drawDeck();
}
function pickDeck(i){ S.active=i; POOLA='all'; save(); drawDeck(); }
function newDeck(){
  if(S.decks.length>=DECKSLOTS) return toast('組札は'+DECKSLOTS+'つまでです');
  S.decks.push(autoDeck(['fu','tu'])); S.active=S.decks.length-1; save(); drawDeck();
}
function delDeck(){
  if(S.decks.length<=1) return toast('最後の組札は消せません');
  S.decks.splice(S.active,1); S.active=0; save(); drawDeck();
}
function toggleAsp(a){
  const d=ensureDeck(), i=d.asp.indexOf(a);
  if(i>=0){ if(d.asp.length<=1) return toast('相は1つ以上必要です'); d.asp.splice(i,1); }
  else{ if(d.asp.length>=2) d.asp.shift(); d.asp.push(a); }
  for(const k in d.cards){ if(!legalIn(BYID[k],d.asp)) delete d.cards[k]; }
  if(d.asp.indexOf(d.sorei)<0&&d.sorei!=='nu') d.sorei=d.asp[0];
  if(POOLA!=='all'&&POOLA!=='nu'&&d.asp.indexOf(POOLA)<0) POOLA='all';
  d.nm=d.asp.map(x=>ASP[x].n).join('')+'の組';
  save(); drawDeck();
}
function setSorei(a){ ensureDeck().sorei=a; save(); drawDeck(); }
function deckAdj(id,n){
  const d=ensureDeck(), C=BYID[id], cur=d.cards[id]||0, cap=usable(id);
  if(n>0){
    if(deckCount(d)>=DECKMAX) return toast('30枚を超えられません');
    if(!legalIn(C,d.asp)) return toast('この相は今の組札に入りません');
    if(cur>=cap) return toast(C.rar==='極'||C.rar==='神'?C.rar+'の札は1枚まで':'持っている枚数までです');
    d.cards[id]=cur+1;
  }else{ if(cur<=1) delete d.cards[id]; else d.cards[id]=cur-1; }
  save(); drawDeck();
}
function autoFill(){ const d=ensureDeck(), nd=autoDeck(d.asp,d.nm); nd.sorei=d.sorei; S.decks[S.active]=nd; save(); drawDeck(); toast('おまかせで組みました'); }
function clearDeck(){ ensureDeck().cards={}; save(); drawDeck(); }

function cancelMode(){ clearUI(); render(); }
function logSheet(all){
  if(!B||!B.log.length) return;
  const g=[];
  B.log.forEach(x=>{
    const last=g[g.length-1];
    if(last&&last.n===x.n&&last.s===x.s) last.a.push(x.m);
    else g.push({n:x.n,s:x.s,a:[x.m]});
  });
  const show = all ? g : g.slice(-6);
  const body = show.map(t=>{
    const mine=t.s===ME;
    return `<div class="logturn"><div class="t ${mine?'':'foe'}">${t.n}巡目・${esc(mine?'自分':sideName(t.s))}</div><div class="ln"></div></div>`
      + t.a.map(m=>`<div class="logline ${mine?'':'foe'}">${esc(m)}</div>`).join('');
  }).join('');
  sheet(`<h3>戦さの記録</h3>
    <div class="crumb">${all?'この対局の全て':'直近'+show.length+'手番'}（${B.log.length}件）</div>
    <div style="max-height:56vh;overflow:auto;margin-top:10px">${body}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      ${(!all&&g.length>show.length)?`<button class="btn sm" style="flex:1" onclick="logSheet(1)">最初から全部見る</button>`:''}
      <button class="btn sm solid" style="flex:1" onclick="closeSheet()">盤に戻る</button>
    </div>`);
  const box=$('sheet').querySelector('div[style*="overflow:auto"]');
  if(box) box.scrollTop=box.scrollHeight;
}
function myTurn(){ return B&&!B.over&&B.cur===ME&&!HIDE&&(MODE!=='net'||NET.on); }
function render(){
  if(!B) return;
  const me=B.p[ME], op=B.p[FOE()], sr=SOREI[me.sorei], mt=myTurn();
  const turnTxt = B.over?'決着' : (B.cur===ME?'自分の手番':esc(sideName(B.cur))+'の手番');
  $('screen-battle').innerHTML=`
   <div class="side">
     <div class="life op" id="life-${FOE()}">${op.life}<small>命</small></div>
     <div class="chip">${esc(sideName(FOE()))}</div>
     <div class="chip">手札 <b>${op.hand.length}</b></div>${deckChip(op)}
     <div class="chip">祖霊「${SOREI[op.sorei].n}」</div>
     <div class="spacer"></div><div class="kipips">${pips(op)}</div>${kiNum(op)}
   </div>
   ${lanesHTML(FOE())}
   <div class="mid"><div class="ln"></div><div class="t">${turnTxt}・${B.turn}巡目</div><div class="ln"></div></div>
   ${pendingHTML()}
   ${lanesHTML(ME)}
   <div class="side">
     <div class="life me" id="life-${ME}">${me.life}<small>命</small></div>
     ${deckChip(me)}
     <div class="kipips">${pips(me)}</div>${kiNum(me)}
     <div class="spacer"></div>
     <button class="btn sm ${me.soreiUsed||me.ki<sr.c||!mt?'ghost':''}"
       ${me.soreiUsed||me.ki<sr.c||!mt?'disabled':''} onclick="tapSorei()">祖霊「${sr.n}」${sr.c}気</button>
   </div>
   <div class="hand">${handHTML()}</div>
   <div class="battlebar">
     <button class="sndsm on" onclick="battleMenu()" title="メニュー（音・降参）">≡</button>
     <div class="log" onclick="logSheet()" tabindex="0" data-tap="1" role="button"
       title="これまでの流れを見る">${B.log.slice(-2).map(x=>esc(x.m)).join('<br>')}<span class="more">…</span></div>
     ${UI.mode?'<button class="btn sm ghost" onclick="cancelMode()">取り消し</button>':
       `<button class="btn sm ${me.buried||me.kiMax>=10||!mt?'ghost':''}" ${me.buried||me.kiMax>=10||!mt?'disabled':''} onclick="tapBury()">気脈に伏せる</button>`}
     <button class="btn sm solid" ${mt?'':'disabled'} onclick="tapEnd()">手番を終える</button>
   </div>`;
  if(B.over) setTimeout(showResult,520);
}
function fxText(s,t,u){
  if(SIM) return;
  const el=$('life-'+s); if(!el) return;
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');
  d.className='fly'; d.textContent=t;
  d.style.left=(r.left+r.width/2)+'px'; d.style.top=(r.top-6)+'px';
  d.style.color = /^\+/.test(t)?'#8fd6a0' : /^-/.test(t)?'#e8674f' : '#efd79b';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1000);
}

/* ── 操作 ── */
function isTarget(u){
  if(UI.mode!=='target'||!UI.card) return false;
  const F=BYID[UI.card.cid][UI.face];
  return F.tgt==='ally' ? u.side===ME : (u.side===FOE()&&targetable(u,ME));
}
function tapHand(i){
  if(!myTurn()) return;
  if(UI.mode==='bury'){ bury(ME,i); clearUI(); after(); return; }
  const c=B.p[ME].hand[i], C=BYID[c.cid], me=B.p[ME];
  const btn=face=>{
    const F=C[face], ok=canPlay(ME,c,face);
    const why = F.c>me.ki?'気が足りない':(F.t==='u'?'空き列がない':'対象がいない');
    return `<button class="btn ${face==='o'?'omote':'ura'}" style="width:100%;margin-top:8px" ${ok?'':'disabled'}
      onclick="chooseFace(${i},'${face}')">${face==='o'?'表':'裏'}で出す・${F.c}気${ok?'':'（'+why+'）'}</button>`;
  };
  sheet(`<h3 style="text-align:center">${esc(C.nm)}</h3>
    <div class="crumb" style="text-align:center">${ASP[C.asp].n}の相・どちらの顔で出す？</div>
    <div class="faces">
      <div class="faceopt o" style="flex:1;min-width:134px"><div class="tagl">表</div>${cardHTML(C,'o')}${btn('o')}</div>
      <div class="faceopt u" style="flex:1;min-width:134px"><div class="tagl">裏</div>${cardHTML(C,'u')}${btn('u')}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sm ghost" style="flex:1" ${me.buried||me.kiMax>=10?'disabled':''} onclick="doBury(${i})">気脈に伏せる（気+1）</button>
      <button class="btn sm ghost" style="flex:1" onclick="closeSheet()">やめる</button>
    </div>`);
}
function after(){ render(); netPush(); }
function doBury(i){ closeSheet(); bury(ME,i); after(); }
function chooseFace(i,face){
  closeSheet();
  const c=B.p[ME].hand[i], F=BYID[c.cid][face];
  UI.card=c; UI.face=face;
  if(F.t==='u'){ UI.mode='place'; }
  else if(F.tgt){ UI.mode='target'; }
  else { playCard(ME,i,face); clearUI(); return after(); }
  render();
}
function tapLane(l){
  if(UI.mode==='place'){
    const i=B.p[ME].hand.indexOf(UI.card);
    if(i>=0) playCard(ME,i,UI.face,l);
    clearUI(); return after();
  }
  if(UI.mode==='move'&&UI.unit){ moveUnit(ME,UI.unit.lane,l); clearUI(); after(); }
}
function tapUnit(s,l){
  if(!B||B.over) return;
  const u=B.p[s].lanes[l]; if(!u) return;
  if(UI.mode==='target'&&isTarget(u)){
    const i=B.p[ME].hand.indexOf(UI.card);
    if(i>=0) playCard(ME,i,UI.face,null,u);
    clearUI(); return after();
  }
  if(!myTurn()||s!==ME) return unitInfo(u);
  const me=B.p[ME], canAtk=u.ready&&!u.frozen;
  const tf=twoFace(u), canFlip=tf&&me.ki>=1;
  const flipLbl = tf ? (me.ki>=1?'反転（1気）':'反転（気が足りない）') : '反転（二面が必要）';
  const oth=BYID[u.cid][u.face==='o'?'u':'o'];
  const front=B.p[FOE()].lanes[l];
  sheet(`<h3 style="text-align:center">${esc(faceOf(u).n)}</h3>
    <div class="crumb" style="text-align:center">${laneName(u.lane)}・力${atkOf(u)}／耐${hpOf(u)}</div>
    ${bothFaces(BYID[u.cid],u.face)}
    <p class="muted" style="text-align:center;margin:10px 0">${tf
      ? '反転すると「'+esc(oth.n)+'」（力'+oth.a+'／耐'+oth.h+'）になる。受けた傷'+u.dmg+'はそのまま引き継ぐ。'
      : 'この札は自分からは反転できない（二面を持つ札か、反転させる術が必要）。'}</p>
    <button class="btn wide solid" ${canAtk?'':'disabled'} onclick="doAtk(${l})">
      ${front?'正面の'+esc(faceOf(front).n)+'を攻撃':'相手の命を'+atkOf(u)+'攻撃'}${canAtk?'':'（'+(u.frozen?'凍結中':'まだ動けない')+'）'}</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn sm" style="flex:1" ${me.moves<=0?'disabled':''} onclick="doMove(${l})">陣替え</button>
      <button class="btn sm" style="flex:1" ${canFlip?'':'disabled'} onclick="doFlip(${l})">${flipLbl}</button>
      <button class="btn sm ghost" style="flex:1" onclick="closeSheet()">閉じる</button>
    </div>`);
}
function unitInfo(u){
  sheet(`<h3 style="text-align:center">${esc(faceOf(u).n)}</h3>
    <div class="crumb" style="text-align:center">力${atkOf(u)}／耐${hpOf(u)}／${u.frozen?'凍結中':'健在'}${hasKw(u,'結界')?'／結界':''}</div>
    ${bothFaces(BYID[u.cid],u.face)}
    <p class="muted" style="text-align:center;margin:10px 0 0">${twoFace(u)
      ? '二面：1気で自分から反転できる。'
      : '反転させるには術か、反転させる効果を持つ札が要る。'}受けた傷${u.dmg}は反転しても残る。</p>
    <button class="btn wide ghost" style="margin-top:12px" onclick="closeSheet()">閉じる</button>`);
}
function doAtk(l){ closeSheet(); attack(B.p[ME].lanes[l]); after(); }
function doMove(l){ closeSheet();
  if(!B.p[ME].lanes.some(x=>!x)) return toast('空いている列がありません');
  UI.mode='move'; UI.unit=B.p[ME].lanes[l]; render(); }
function doFlip(l){ closeSheet(); flipSelf(ME,l); after(); }
function tapBury(){ UI.mode='bury'; render(); }
function tapSorei(){ useSorei(ME); after(); }
async function tapEnd(){
  if(!myTurn()) return;
  clearUI();
  endTurn(); render();
  if(B.over) return;
  if(MODE==='solo') await aiTurn();
  else if(MODE==='hot') handoff();
  else netPush();
}
async function aiTurn(){
  const g=GNOW||GATES[CURGATE]||{ai:3};
  await wait(340);
  if(aiBury()){ render(); await wait(340); }
  for(let step=0;step<16&&!B.over;step++){
    const a=aiChoose(1,g.ai);
    if(!a) break;
    applyAction(1,a); render();
    await wait(a.k==='atk'?520:430);
  }
  if(!B.over){ endTurn(); render(); }
}

/* ── 対戦中のメニューと降参 ── */
function battleMenu(){
  const endless=GNOW&&GNOW.endless;
  sheet(`<h3>対戦中</h3><div class="crumb">${MODE==='solo'?(endless?'無明の間':'盤上十二門'):'対人戦'}・${B?B.turn:1}巡目</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="musicToggle();battleMenu()">曲：${AUD.musOn?'入':'切'}</button>
      <button class="btn" style="flex:1" onclick="soundToggle();battleMenu()">効果音：${AUD.on?'入':'切'}</button>
    </div>
    <button class="btn wide" style="margin-top:16px;border-color:var(--shu);color:#f3c0b5;
      background:linear-gradient(180deg,rgba(196,64,47,.24),rgba(196,64,47,.06))"
      ${B&&!B.over?'':'disabled'} onclick="askResign()">降参する</button>
    <button class="btn wide ghost" style="margin-top:10px" onclick="closeSheet()">盤に戻る</button>`);
}
function askResign(){
  const endless=GNOW&&GNOW.endless;
  const msg = MODE==='solo'
    ? (endless
        ? `この対局は負けになり、<b style="color:#e8674f">連勝${S.streak||0}が0に戻ります</b>。魂片ももらえません。`
        : 'この対局は負けになります。魂片はもらえません。門の突破記録は消えません。')
    : `${esc(sideName(FOE()))}の勝ちになります。`;
  sheet(`<h3>降参しますか？</h3><p class="muted">${msg}</p>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn sm ghost" style="flex:1" onclick="battleMenu()">やめておく</button>
      <button class="btn sm solid" style="flex:1" onclick="doResign()">降参する</button>
    </div>`);
}
function doResign(){
  closeSheet();
  if(!B||B.over) return;
  clearUI();
  B.resigned=ME;
  B.p[ME].life=0;
  B.over=true; B.winner=FOE();
  logM((MODE==='solo'?'自分':sideName(ME))+'が降参した');
  if(MODE==='net') netPush();
  render();
}

/* ── 決着 ── */
function showResult(){
  if(!B||!B.over||B.shown) return; B.shown=true;
  const win=B.winner===ME;
  sfx(win?'win':'lose');
  if(MODE!=='solo'){
    const again = MODE==='hot' || NET.role==='host';
    sheet(`<div class="result">
      <div class="crumb">${MODE==='hot'?'同じ端末で交互に':'二台をつないで'}・対人戦</div>
      <div class="big ${win?'win':'lose'}">${win?'勝':(B.resigned===ME?'投':'負')}</div>
      <p class="muted">${B.resigned!=null?esc(sideName(B.resigned))+'が降参。':''}${esc(sideName(B.winner))}の勝ち。</p>
      <div style="display:flex;gap:8px;margin-top:16px">
        ${again?`<button class="btn sm" style="flex:1" onclick="rematch()">もう一度</button>`:''}
        <button class="btn sm solid" style="flex:1" onclick="leaveVersus()">終わる</button>
      </div></div>`);
    return;
  }
  if(GNOW&&GNOW.endless){
    const st=S.streak||0;
    let souls, bonus='';
    if(win){
      S.streak=st+1; S.best=Math.max(S.best||0,S.streak);
      souls=60+S.streak*15;
      if(S.streak%3===0){ const c=grantRare('極');
        if(c) bonus=`<p class="muted">${S.streak}連勝の証として <b style="color:${RAR[c.rar].c}">${esc(c.nm)}</b>（${c.rar}）を授かった。</p>`; }
    }else{ S.streak=0; souls=(B.resigned!=null?0:15); }
    S.souls+=souls; S.plays++; if(win) S.wins++;
    save();
    sheet(`<div class="result">
      <div class="crumb">無明の間・${esc(GNOW.who)}</div>
      <div class="big ${win?'win':'lose'}">${win?'勝':(B.resigned!=null?'投':'負')}</div>
      <p class="muted">${win?`これで<b style="color:var(--kin-hi)">${S.streak}連勝</b>。次の相手はさらに手強い。`
        :(B.resigned!=null?`降参した。最高記録は${S.best||0}連勝。`:`ここで途切れた。最高記録は${S.best||0}連勝。`)}</p>
      ${bonus}
      <div class="coin" style="display:inline-block;margin:10px 0">魂片 +${souls}</div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn sm" style="flex:1" onclick="closeSheet();startEndless()">次の相手</button>
        <button class="btn sm solid" style="flex:1" onclick="closeSheet();go('gates')">戻る</button>
      </div></div>`);
    return;
  }
  const first=win&&!S.gates[CURGATE];
  const souls = win ? (first?120+CURGATE*15:40) : (B.resigned!=null?0:12);
  S.souls+=souls; S.plays++; if(win){ S.wins++; S.gates[CURGATE]=1; }
  let bonus='';
  if(first){ const c=grantRare(CURGATE>=9?'極':'秘');
    if(c) bonus=`<p class="muted">突破の証として <b style="color:${RAR[c.rar].c}">${esc(c.nm)}</b>（${c.rar}）を授かった。</p>`; }
  save();
  const g=GATES[CURGATE];
  sheet(`<div class="result">
    <div class="crumb">${g.no}の門・${esc(g.who)}</div>
    <div class="big ${win?'win':'lose'}">${win?'勝':(B.resigned!=null?'投':'負')}</div>
    <p class="muted">${win?(first?'門を突破した。':'ふたたび勝った。')
      :(B.resigned!=null?'降参した。組札を練り直して挑み直そう。':'命が尽きた。組札を練り直そう。')}</p>
    ${bonus}
    <div class="coin" style="display:inline-block;margin:10px 0">魂片 +${souls}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn sm" style="flex:1" onclick="closeSheet();startGate(${CURGATE})">もう一度</button>
      <button class="btn sm solid" style="flex:1" onclick="closeSheet();go('gates')">十二門へ戻る</button>
    </div></div>`);
}
function rematch(){
  closeSheet();
  if(MODE==='hot'){
    const b=S.decks.find(x=>x.nm===B.names[1])||ensureDeck();
    ME=0; HIDE=false; clearUI();
    startVersus(ensureDeck(),b,'先手','後手'); render(); handoff(true); return;
  }
  if(MODE==='net'&&NET.role==='host'&&NET.peerDeck){
    ME=0; HIDE=false; clearUI();
    startVersus(ensureDeck(),NET.peerDeck,myName(),NET.peerName);
    netSend({t:'start',s:fullSnap()}); render();
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('veil').classList.contains('on')&&!STICKY) closeSheet(); else if(UI.mode) cancelMode(); return; }
  const a=document.activeElement;
  if((e.key==='Enter'||e.key===' ')&&a&&a.dataset&&a.dataset.tap){ e.preventDefault(); a.click(); }
});
['pointerdown','keydown','touchstart'].forEach(ev=>
  document.addEventListener(ev,audioArm,{once:true,passive:true}));

function netAutoJoin(code){
  saveName();
  go('gates');
  sheet(`<h3>招きが届いています</h3><p class="muted">つなぐ準備をしています…</p>`);
  setTimeout(()=>netDoJoin(code),60);
}

/* ============ アプリとしての振る舞い ============ */
function standalone(){
  return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)
    ||(window.matchMedia&&matchMedia('(display-mode: minimal-ui)').matches)
    ||navigator.standalone===true;
}
let INSTALL=null;
function showInstall(){
  const w=$('installwrap'); if(!w) return;
  w.innerHTML = (INSTALL&&!standalone())
    ? '<button class="btn" onclick="doInstall()">ホーム画面に追加する</button>'
    : '';
}
async function doInstall(){
  if(!INSTALL) return;
  try{ INSTALL.prompt(); await INSTALL.userChoice; }catch(e){}
  INSTALL=null; showInstall();
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); INSTALL=e; showInstall(); });
window.addEventListener('appinstalled',()=>{ INSTALL=null; showInstall(); toast('ホーム画面に追加しました'); });

/* 戻るボタンでアプリが閉じないように、画面内を1段ずつ戻る */
function pushNav(){ try{ history.pushState({uo:1},''); }catch(e){} }
window.addEventListener('popstate',()=>{
  if($('veil').classList.contains('on')){ if(!STICKY) closeSheet(); pushNav(); return; }
  if(UI.mode){ cancelMode(); pushNav(); return; }
  if(CUR==='battle'){
    pushNav();
    if(B&&!B.over) askResign(); else leaveVersus();
    return;
  }
  if(CUR!=='title'&&CUR!=='gates'){ go('gates'); pushNav(); return; }
});

/* 常駐係（オフライン再生と更新） */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
function bootDone(){
  const b=$('boot'); if(!b) return;
  b.classList.add('gone');
  setTimeout(()=>{ if(b&&b.parentNode) b.parentNode.removeChild(b); },600);
}

/* ============ 起動 ============ */
S=load()||freshSave();
if(!S.coll) S.coll={};
CARDS.forEach(c=>{ if(c.rar==='常'&&!(c.id in S.coll)) S.coll[c.id]=2; });
if(S.mus===0) AUD.musOn=false;
if(S.sfx===0) AUD.on=false;
ensureDeck(); save();
drawSoundBtn();
$('titlestat').innerHTML='全<b>'+CARDS.length+'</b>種・<b>'+(CARDS.length*2)+'</b>の顔／七つの相／五段の位';
go('title');
showInstall();
pushNav();
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(()=>setTimeout(bootDone,320)); }
else setTimeout(bootDone,700);
setTimeout(bootDone,2200);
(function(){
  const m=/[#&]j=([A-Za-z0-9_\-]+)/.exec(location.hash||'');
  if(m&&netAvail()){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    netAutoJoin(m[1]);
  }
})();

</script>
</body>
